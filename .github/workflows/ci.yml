name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/verify.sh
        env:
          BULIG_FORBIDDEN_TERMS: ${{ secrets.BULIG_FORBIDDEN_TERMS }}
